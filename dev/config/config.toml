# Terminus development config — copied into .dev/config/ by scripts/dev.sh on a
# fresh checkout (delete .dev/ to start over from this baseline).
#
# This file is hot-reloaded: saving it re-paints the running window, no restart.
#
# Full reference: https://rioterm.com/docs/config

# Padding around the terminal grid, in logical pixels. A sequence, CSS-style:
# one value (all sides), two (top/bottom, left/right) or four
# (top, right, bottom, left). A `{ top = ..., left = ... }` table is rejected —
# rio's Margin deserializer only accepts a sequence.
margin = [12, 12, 12, 12]

[fonts]
size = 16

[colors]
background = "#141416"
foreground = "#e8e8e8"
cursor = "#7aa2f7"

# rio starts the terminal's shell as a *login* shell (`bash --login`), which
# bootstraps from /etc/profile. Inside the sandbox this dev loop runs in,
# /etc/profile is the sandbox's own file (the FHS environment bwrap-mounts it
# over NixOS's), so a login shell lands on the sandbox prompt —
# `hermes-fhs-fhsenv:nixos@nixos:~$` — and never reads /etc/bashrc: no
# bash-completion, no NixOS aliases, and the sandbox's PATH wins.
#
# Empty args makes the shell interactive non-login, which boots the way a
# terminal opened from the desktop session does (~/.bashrc → /etc/bashrc) and
# gives the real session prompt and Tab completion. Only the dev loop needs
# this: launched from a normal session, rio's login-shell default is correct.
[shell]
args = []
