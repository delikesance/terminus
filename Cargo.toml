[workspace]
resolver = "2"
members = ["crates/terminus-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/terminus-app/terminus"
authors = ["Terminus Contributors"]

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
dirs = "6"
futures = "0.3"
parking_lot = "0.12"
portable-pty = "0.8"
rand = "0.8"
russh = "0.62.7"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "chrono"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
alacritty_terminal = { version = "0.26", default-features = false }
fontdue = "0.9"
rustybuzz = "0.20"
zeroize = { version = "1", features = ["derive"] }
