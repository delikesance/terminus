[workspace]
resolver = "2"
members = ["crates/terminus-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/terminus-app/terminus"
authors = ["Terminus Contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
dirs = "6"
futures = "0.3"
parking_lot = "0.12"
portable-pty = "0.8"
russh = "0.54"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.15"
fontdue = "0.9"
