services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: terminus
      POSTGRES_PASSWORD: terminus
      POSTGRES_DB: terminus
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminus -d terminus"]
      interval: 2s
      timeout: 5s
      retries: 30

  sshd:
    build: ./docker/sshd
    ports:
      - "2222:22"
    healthcheck:
      test: ["CMD", "pgrep", "sshd"]
      interval: 2s
      timeout: 5s
      retries: 30
