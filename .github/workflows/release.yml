# Optimized multi-platform release (no Goreleaser Pro).
#
# Artifacts:
#   - Windows x86_64 zip (rio.exe)
#   - macOS aarch64 tarball (rio)
#   - Fedora/RHEL RPM (rioterm)
#   - NixOS: nix build + Cachix push + rio binary upload
#
# Secrets: CACHIX_AUTH_TOKEN (optional but recommended for the nix job).
# Triggers: v*.*.* tags and workflow_dispatch (artifacts only, no GitHub Release).

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
          cache-targets: true
          cache-all-crates: true
      - name: Build
        run: cargo build --release -p rioterm --features wgpu
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rio.exe dist/rio.exe
          (
            cd dist
            7z a -tzip rio-windows-x86_64.zip rio.exe
          )
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/rio-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS aarch64
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
          cache-targets: true
          cache-all-crates: true
      - name: Build
        run: cargo build --release -p rioterm --features wgpu
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/rio dist/rio
          chmod +x dist/rio
          tar -C dist -czf dist/rio-macos-aarch64.tar.gz rio
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/rio-macos-aarch64.tar.gz
          if-no-files-found: error

  linux-rpm:
    name: Linux RPM (Fedora)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev pkg-config libfontconfig1-dev \
            libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxss-dev glslang-tools rpm \
            libkrb5-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-rpm
          cache-targets: true
          cache-all-crates: true
      - name: Build
        # Single x11+wgpu RPM for speed (wayland variant can be added later).
        env:
          LIBGSSAPI_IMPL: mit
        run: >
          cargo build --release -p rioterm
          --no-default-features --features x11,wgpu
      - name: Install nfpm
        env:
          NFPM_VERSION: "2.41.2"
        run: |
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version
      - name: Package RPM
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(perl -ne 'print $1 and exit if /^version = \"([^\"]+)\"/' Cargo.toml)-ci.${GITHUB_RUN_NUMBER}"
          fi
          export VERSION
          nfpm package --packager rpm --target dist/ --config misc/nfpm-rioterm.yaml
          ls -la dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

  nix:
    name: NixOS (flake + Cachix)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: rioterm
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Empty token → skip push (binary artifact still uploaded).
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - name: Build flake
        run: nix build --max-jobs auto --print-build-logs
      - name: Package binary
        run: |
          mkdir -p dist
          BIN="$(readlink -f result/bin/rio || true)"
          if [ -z "$BIN" ] || [ ! -e "$BIN" ]; then
            BIN="$(find result -type f -name rio | head -1)"
          fi
          test -n "$BIN" && test -x "$BIN"
          cp "$BIN" dist/rio-nixos-x86_64
          chmod +x dist/rio-nixos-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: nixos-x86_64
          path: dist/rio-nixos-x86_64
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, macos, linux-rpm, nix]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect + checksums
        run: |
          mkdir -p release
          find artifacts -type f -print0 | xargs -0 -I{} cp {} release/
          cd release
          sha256sum * > checksums.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
