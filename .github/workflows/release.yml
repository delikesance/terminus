name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # NixOS distribution — same release path as deb/rpm/exe (push to main).
  nix-distribute:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Setup Cachix
        if: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: delikesance-terminus
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build Terminus Nix package
        run: nix build .#terminus -L
      - name: Push store path to Cachix
        if: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
        run: cachix push delikesance-terminus ./result
      - name: Publish flake to FlakeHub
        uses: DeterminateSystems/flakehub-push@v6
        with:
          name: delikesance/terminus
          visibility: public
          rolling: true

  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            cache: macos-arm
            args: --config src-tauri/tauri.release.conf.json --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            cache: macos-intel
            args: --config src-tauri/tauri.release.conf.json --target x86_64-apple-darwin --bundles app,dmg
          - platform: ubuntu-22.04
            cache: linux
            args: --config src-tauri/tauri.release.conf.json --bundles appimage,deb,rpm
          - platform: windows-latest
            cache: windows
            args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.windows-sign.conf.json --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: release-${{ matrix.cache }}
          cache-on-failure: true
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 \
            libkrb5-dev clang libclang-dev llvm-dev pkg-config rpm
          echo "LIBCLANG_PATH=$(llvm-config-14 --libdir 2>/dev/null || llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Force Apple GSS
        if: runner.os == 'macOS'
        run: echo "LIBGSSAPI_IMPL=apple" >> $GITHUB_ENV
      - run: npm ci
      - name: Generate icons
        if: runner.os != 'Windows'
        run: python3 scripts/gen-icons.py
      - name: Generate icons
        if: runner.os == 'Windows'
        run: python scripts/gen-icons.py
      - name: Stamp version from run number
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const version = "0.1." + process.env.GITHUB_RUN_NUMBER;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            const confPath = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
            console.log("release version", version);
          '
      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $confPath = "src-tauri/tauri.windows-sign.conf.json"
          $windows = [ordered]@{
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No WINDOWS_CERTIFICATE secret; NSIS installer stays unsigned (SmartScreen)."
          } else {
            $dir = Join-Path $env:RUNNER_TEMP "codesign"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $pfx = Join-Path $dir "certificate.pfx"
            $b64 = ($env:WINDOWS_CERTIFICATE -replace '\s','')
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($b64))
            $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            $windows.certificateThumbprint = $imported.Thumbprint
            Write-Host "Imported Authenticode certificate $($imported.Thumbprint)"
          }
          $json = (@{ bundle = @{ windows = $windows } } | ConvertTo-Json -Depth 6)
          [IO.File]::WriteAllText((Join-Path (Get-Location) $confPath), $json)
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Terminus v__VERSION__
          releaseBody: |
            First install (pick your OS):
            - Windows: `Terminus_*_x64-setup.exe`
            - macOS Apple Silicon: `Terminus_*_aarch64.dmg`
            - macOS Intel: `Terminus_*_x64.dmg`
            - Linux: `Terminus_*_amd64.deb`, `Terminus_*.rpm`, or the `.AppImage`
            - NixOS / Nix: FlakeHub `delikesance/terminus`, or `nix profile install github:delikesance/terminus#terminus` (Cachix: `delikesance-terminus`)

            If Windows SmartScreen says the installer is unrecognized: More info → Run anyway.
            That warning goes away only after the NSIS `.exe` is Authenticode-signed (not the updater key).

            `.tar.gz`, `.sig`, and `latest.json` are for the in-app updater only.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      - name: Prefer host Kerberos in AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: node scripts/strip-appimage-krb5.mjs
      - name: Assert bundled native libs
        shell: bash
        run: node scripts/assert-portable-libs.mjs
      - name: sccache stats
        if: always()
        run: sccache --show-stats
