name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ci-linux-nix-selftest
          cache-on-failure: true
      - uses: docker/setup-buildx-action@v3
      - name: Start fixture services
        run: docker compose up -d --wait --build
      - name: Prove engine (Rust cargo)
        run: nix develop --command cargo run -p terminus-core --bin terminus-selftest
      - name: Install Node dependencies
        run: nix develop --command npm install
      - name: Prove behavioral asserts (search-ux)
        run: nix develop --command npm run test:search-ux
      - name: Prove behavioral asserts (group-softdelete)
        run: nix develop --command npm run test:group-softdelete

  e2e-playwright:
    runs-on: ubuntu-latest
    env:
      # Frontend bridge (window.__terminusTest) + Rust test command opt-in.
      # Normal release/build-* jobs do NOT set these, so hooks stay absent.
      VITE_E2E: "1"
      TERMINUS_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ci-linux-nix-e2e
          cache-on-failure: true
      - name: Install Node dependencies
        run: nix develop --command npm install
      - name: Verify E2E Rust hooks compile (TERMINUS_E2E=1)
        run: nix develop --command cargo check -p terminus -p terminus-core
      - name: Install Playwright browsers
        run: nix develop --command npx playwright install --with-deps chromium
      - name: Build frontend for preview
        run: nix develop --command npm run build
      - name: Run Playwright E2E tests
        run: nix develop --command npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-linux:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ci-linux-nix-tauri
          cache-on-failure: true
      - name: Install frontend deps
        run: nix develop --command npm install
      - name: Generate icons
        run: nix develop --command python3 scripts/gen-icons.py
      - name: Build Tauri
        run: nix develop --command npm run tauri -- build --bundles deb

  build-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ci-macos
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/gen-icons.py
      - run: npm run tauri -- build --bundles app
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  build-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ci-windows
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/gen-icons.py
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: terminus-windows-nsis
          path: |
            target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 14
      - name: sccache stats
        if: always()
        run: sccache --show-stats
