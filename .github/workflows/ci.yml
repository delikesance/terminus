# Check formatting on every pull request and on pushes to `development`.
# Build and tests run locally in the pre-commit hook instead of on the
# runners, which kept every PR waiting several minutes.

name: CI

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - name: Check formatting
        run: cargo fmt --all -- --check
