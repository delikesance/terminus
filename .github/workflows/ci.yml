# Check formatting, lint, build and test the workspace on every pull
# request and on pushes to `development`. Mirrors the Linux deps the nix devshell provides
# (package.nix) with apt, so the toolchain from rust-toolchain.toml is
# enough and runs stay fast with the cargo cache.

name: CI

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libclang-dev glslang-tools \
            libfontconfig1-dev libkrb5-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxcb1-dev libgl-dev libvulkan-dev

      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      # Warnings fail the job. Dead code kept on purpose carries an
      # `#[allow(dead_code)]` at the item rather than a crate-wide allow.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Build & test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libclang-dev glslang-tools \
            libfontconfig1-dev libkrb5-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxcb1-dev libgl-dev libvulkan-dev

      # rustup picks the pinned channel and components from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build
        run: cargo test --workspace --locked --no-run

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
