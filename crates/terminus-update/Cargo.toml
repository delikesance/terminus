[package]
name = "terminus-update"
version = "0.1.0"
edition = "2021"
description = "Signed self-update for Terminus: release check, verification and install"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json", "platform-verifier"] }
minisign-verify = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
minisign = "0.7"
tempfile = "3"
