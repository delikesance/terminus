[package]
name = "terminus-bridge"
version = "0.1.0"
edition = "2021"
description = "Async facade bridging terminus-core services to Rio's event loop"

[dependencies]
terminus-core = { workspace = true }
teletypewriter = { workspace = true }
corcovado = { workspace = true }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tempfile = "3"
russh = "0.62.7"
russh-sftp = "2"
rand_keygen = { package = "rand", version = "0.10" }
zip = { version = "2", default-features = false, features = ["deflate"] }
