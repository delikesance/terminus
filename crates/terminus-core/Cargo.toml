[package]
name = "terminus-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
russh = "0.62.7"
russh-sftp = "2"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
# NOTE: XChaCha20Poly1305 is available as chacha20poly1305::XChaCha20Poly1305;
# the separate `xchacha20poly1305` crate does not exist on crates.io.
zeroize = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
hex = "0.4"
base64 = "0.23"
tracing = "0.1"
thiserror = "1"
dirs = "4"
rand = "0.8"
# ssh-key (via russh) expects rand 0.10 CryptoRng for PrivateKey::random.
rand_keygen = { package = "rand", version = "0.10" }

[target.'cfg(unix)'.dependencies]
libgssapi = "0.11"

[dev-dependencies]
tempfile = "3"
