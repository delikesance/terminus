# nfpm config for rioterm RPM (Fedora/RHEL-compatible).
# VERSION is injected by the Release workflow (tag or CI build number).
name: rioterm
arch: amd64
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Raphael Amorim <rapha850@gmail.com>
description: |
  A hardware-accelerated GPU terminal emulator powered by WebGPU.
vendor: Rio
homepage: https://rioterm.com
license: MIT
depends:
  - glibc
  - libstdc++
  - fontconfig
  - libX11
  - libXcursor
  - libXi
  - libXrandr
contents:
  - src: ./target/release/rio
    dst: /usr/bin/rio
    file_info:
      mode: 0755
  - src: ./misc/rio.desktop
    dst: /usr/share/applications/rio.desktop
  - src: ./misc/logo.svg
    dst: /usr/share/icons/hicolor/scalable/apps/rio.svg
  - src: ./LICENSE
    dst: /usr/share/doc/rioterm/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/rioterm/README.md
rpm:
  group: Applications/System
  compression: xz
