# nfpm config for the Terminus (rioterm) desktop packages.
# VERSION is injected from the environment by scripts/release.sh.
name: rioterm
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: delikesance <95828763+delikesance@users.noreply.github.com>
description: |
  A hardware-accelerated GPU terminal emulator powered by WebGPU.
vendor: Terminus
homepage: https://github.com/delikesance/terminus
license: MIT
contents:
  - src: ./target/release/rio
    dst: /usr/bin/rio
    file_info:
      mode: 0755
  - src: ./misc/rio.desktop
    dst: /usr/share/applications/rio.desktop
  - src: ./misc/logo.svg
    dst: /usr/share/icons/hicolor/scalable/apps/rio.svg
  - src: ./LICENSE
    dst: /usr/share/doc/rioterm/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/rioterm/README.md
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - libfontconfig1
      - libgl1
      - libxkbcommon0
      - libvulkan1
      - libkrb5-3
      - libx11-6
      - libxcursor1
      - libxi6
      - libxrandr2
      - libxcb1
      - libwayland-client0
      - libwayland-cursor0
  rpm:
    depends:
      - glibc
      - libgcc
      - libstdc++
      - fontconfig
      - libglvnd-glx
      - libxkbcommon
      - vulkan-loader
      - krb5-libs
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - libxcb
      - wayland-libs
rpm:
  group: Applications/System
  compression: xz
