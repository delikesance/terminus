# nfpm config for Terminus desktop packages.
# VERSION is injected from the environment by scripts/release.sh.
name: terminus
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: delikesance <95828763+delikesance@users.noreply.github.com>
description: |
  A modern hardware-accelerated GPU terminal emulator.
vendor: Terminus
homepage: https://github.com/delikesance/terminus
license: MIT
contents:
  - src: ./dist/linux/terminus
    dst: /usr/bin/terminus
    file_info:
      mode: 0755
  - src: ./misc/terminus.desktop
    dst: /usr/share/applications/terminus.desktop
  - src: ./misc/logo.svg
    dst: /usr/share/icons/hicolor/scalable/apps/terminus.svg
  - src: ./LICENSE
    dst: /usr/share/doc/terminus/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/terminus/README.md
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libstdc++6 (>= 11)
      - libfontconfig1
      - libfreetype6
      - libgl1
      - libxkbcommon0
      - libvulkan1
      - libkrb5-3
      - libx11-6
      - libxcursor1
      - libxi6
      - libxrandr2
      - libxcb1
      - libwayland-client0
      - libwayland-cursor0
  rpm:
    depends:
      - glibc >= 2.35
      - libgcc
      - libstdc++ >= 11
      - fontconfig
      - freetype
      - libglvnd-glx
      - libxkbcommon
      - vulkan-loader
      - krb5-libs
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - libxcb
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
rpm:
  group: Applications/System
  compression: xz
